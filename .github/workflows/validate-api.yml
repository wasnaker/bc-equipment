name: Validate API package

on:
  push:
    branches:
      - chore/equipment-package-identity
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build API
        run: npm run build:api
      - name: Verify package artifacts
        run: npm run verify:api-package
