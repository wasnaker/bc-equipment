name: Validate Equipment package

on:
  push:
    branches:
      - chore/equipment-package-identity
      - feat/equipment-groups-subgroups
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-package:
    name: API build and package exports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Equipment module
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install module dependencies
        run: npm ci
      - name: Build API
        run: npm run build:api
      - name: Verify package artifacts
        run: npm run verify:api-package

  frontend-typecheck:
    name: Frontend typecheck against host contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Equipment module
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checkout frontend host
        run: git clone --depth 1 https://github.com/wasnaker/brocoders-react-web.git "$RUNNER_WORKSPACE/../brocoders-react-web"
      - name: Install host dependencies
        working-directory: ${{ runner.workspace }}/../brocoders-react-web
        run: npm ci
      - name: Prepare host module registry and module dependencies
        working-directory: ${{ runner.workspace }}/../brocoders-react-web
        run: |
          node scripts/generate-module-registry.mjs
          ln -s "$RUNNER_WORKSPACE/../brocoders-react-web/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Typecheck Equipment frontend
        working-directory: ${{ runner.workspace }}/../brocoders-react-web
        run: ./node_modules/.bin/tsc --project "$GITHUB_WORKSPACE/web/tsconfig.check.json" --pretty false
